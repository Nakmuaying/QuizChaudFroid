<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<title>Quiz Chaud / Froid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#e9eff2;--surface:#fff;--ink:#0f2a3d;--mute:#5b7080;--line:#c9d5dc;--accent:#1d4ed8;--accent-ink:#fff;--ok:#17703f;--ok-bg:#dcf2e5;--ko:#b3261e;--ko-bg:#fbe3e0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a25;--surface:#122636;--ink:#e6eef3;--mute:#92a8b7;--line:#274255;--accent:#6e95ff;--accent-ink:#0b1a25;--ok:#6fd49b;--ok-bg:#12382a;--ko:#ff8f86;--ko-bg:#40191a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a25;--surface:#122636;--ink:#e6eef3;--mute:#92a8b7;--line:#274255;--accent:#6e95ff;--accent-ink:#0b1a25;--ok:#6fd49b;--ok-bg:#12382a;--ko:#ff8f86;--ko-bg:#40191a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:20px 18px 40px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(2.3rem,11vw,3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:600;line-height:1.25}
p{margin:0}
.mute{color:var(--mute)}
.hero{padding:28px 0 8px}
.hero p{margin-top:12px;max-width:34ch}
.group{margin-top:26px}
.group>b{display:block;margin-bottom:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn,.opt{font:inherit;color:inherit;cursor:pointer}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:99px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:14px;padding:15px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%;margin-top:22px;font-size:1.05rem}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row .btn{margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;margin:10px 0 22px;font-size:.95rem;color:var(--mute)}
.hint{margin:8px 0 16px;color:var(--mute);font-size:.95rem}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-size:.9rem;font-weight:800;margin-top:1px}
.opt.single .mk{border-radius:50%}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.on .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.ko{background:var(--ko-bg);border-color:var(--ko)}
.opt.ko .mk{background:var(--ko);border-color:var(--ko);color:var(--bg)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
figure{margin:16px 0 0}
figure img{max-width:100%;border-radius:12px;display:block}
.titre{color:var(--mute);font-size:.95rem;margin-bottom:6px}
.ans{margin-top:18px;background:var(--surface);border-left:5px solid var(--accent);border-radius:12px;padding:14px 16px;white-space:pre-line}
.ans b{display:block;margin-bottom:4px}
.ans.note{border-left-color:var(--mute);margin-top:12px}
.verdict{margin-top:16px;font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--ko)}
sub,sup{font-size:.72em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .2em}
.fr>span{padding:0 .25em}
.fr>span:first-child{border-bottom:1.5px solid currentColor}
.score{font:800 5rem/1 "Bricolage Grotesque",system-ui,sans-serif;margin:22px 0 4px;letter-spacing:-.03em}
.rev{margin-top:26px;display:grid;gap:12px}
.rev div{background:var(--surface);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.rev small{display:block;color:var(--mute);margin-top:4px;white-space:pre-line}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

un effort", "L'âge (personnes âgées, nourrissons), surtout en cas de maladies chroniques", "La prise de certains traitements ou toxiques (drogues)", "Des vêtements contraignants qui empêchent l'évaporation de la sueur"], "remarque": "Plus la température ambiante est élevée, plus l'organisme a du mal à perdre de la chaleur. La température centrale s'élève, avec une perte d'eau et de sels minéraux. L'exposition est aggravée par sa durée."}, {"type": "qcm", "question": "Quels organes ou fonctions une exposition prolongée à la chaleur peut-elle atteindre ?", "options": ["Les reins", "Les os longs", "Le foie", "Les fonctions neurologiques et circulatoires"], "correct": ["Le foie", "Les reins", "Les fonctions neurologiques et circulatoires"], "remarque": "Elle peut aussi entraîner une déshydratation, avec des séquelles graves ou le décès, lorsque le système de thermorégulation est dépassé ou cesse de fonctionner."}, {"type": "qcm", "question": "Quels signes de détresse neurologique peut présenter une victime d'une affection liée à la chaleur ?", "options": ["Troubles du comportement (prostration, agressivité, agitation)", "Délire", "Convulsions", "Confusion et désorientation", "Peau pâle, froide et sèche"], "correct": ["Confusion et désorientation", "Délire", "Convulsions", "Troubles du comportement (prostration, agressivité, agitation)"], "remarque": "Une perte de connaissance et des convulsions sont possibles. La peau est plutôt chaude et rouge, couverte ou non de sueurs."}, {"type": "qcm", "question": "Quels signes cutanéomuqueux peut-on observer lors d'une affection liée à la chaleur ?", "options": ["Une température anormalement élevée (supérieure à 37,5 °C)", "Une peau chaude, rouge, couverte ou non de sueurs", "Une hémorragie sous-cutanée puis extériorisée", "Une peau pâle, froide et sèche"], "correct": ["Une peau chaude, rouge, couverte ou non de sueurs", "Une température anormalement élevée (supérieure à 37,5 °C)", "Une hémorragie sous-cutanée puis extériorisée"], "remarque": "Les signes de détresse respiratoire (fréquence respiratoire élevée, oppression thoracique, sensation d'étouffement) et circulatoire (fréquence cardiaque élevée, hypotension, pouls irrégulier) peuvent s'y associer."}, {"type": "qcm", "question": "Si la victime est consciente et sans atteinte neurologique, de quoi se plaint-elle souvent ?", "options": ["Céphalées, bourdonnements d'oreilles ou vertiges", "Crampes musculaires ou hypertonie musculaire", "Nausées", "Faiblesse musculaire et fatigue générale", "Picotements et engourdissement des doigts avec peau cireuse"], "correct": ["Faiblesse musculaire et fatigue générale", "Céphalées, bourdonnements d'oreilles ou vertiges", "Nausées", "Crampes musculaires ou hypertonie musculaire"], "remarque": "Le 1er regard est essentiel : il permet de constater l'exposition à la chaleur ou au soleil, ou un contexte d'effort important."}, {"type": "qcm", "question": "Comment définit-on l'insolation (ou épuisement hyperthermique) ?", "options": ["Température supérieure à 40 °C avec convulsions", "Uniquement des crampes musculaires", "Impression de chaleur, céphalées voire vertiges, peau rouge et température inférieure ou égale à 40 °C"], "correct": ["Impression de chaleur, céphalées voire vertiges, peau rouge et température inférieure ou égale à 40 °C"], "remarque": "Si la victime présente seulement des crampes, on parle de crampes liées à la chaleur."}, {"type": "qcm", "question": "Quels éléments orientent vers un coup de chaleur ?", "options": ["Une peau pâle, froide et sèche", "Seulement des crampes musculaires", "Une température corporelle, mesurée de manière fiable, supérieure à 40 °C", "Des troubles neurologiques, qui peuvent précéder l'élévation de la température"], "correct": ["Une température corporelle, mesurée de manière fiable, supérieure à 40 °C", "Des troubles neurologiques, qui peuvent précéder l'élévation de la température"], "remarque": "La peau est souvent rouge, sèche et brûlante. Des difficultés à marcher, une confusion ou des troubles visuels traduisent une atteinte cérébrale. L'apparition de convulsions ou d'une perte de connaissance indique une aggravation."}, {"type": "qcm", "question": "Quels sont les principes de l'action de secours devant une affection liée à la chaleur ?", "options": ["Soustraire la victime à la cause", "Réhydrater, si possible", "Refroidir la victime rapidement", "Réchauffer la victime avec une couverture"], "correct": ["Soustraire la victime à la cause", "Refroidir la victime rapidement", "Réhydrater, si possible"], "remarque": "Un avis médical est demandé dans les cas d'épuisement et de coup de chaleur."}, {"type": "qcm", "question": "Quel geste réalise-t-on dans tous les cas devant une affection liée à la chaleur ?", "options": ["Une immersion complète dans l'eau glacée", "Un refroidissement passif de la victime", "Une réhydratation forcée avec de l'alcool"], "correct": ["Un refroidissement passif de la victime"], "remarque": "Selon la gravité, on y ajoute un refroidissement actif simple (insolation) ou avancé (coup de chaleur et hyperthermie maligne d'effort)."}, {"type": "qcm", "question": "Une victime ne présente pas de détresse vitale. Quelle conduite adopter ?", "options": ["La faire boire uniquement de l'alcool pour la rafraîchir", "L'installer en position d'attente et la réhydrater avec de l'eau ou, mieux, un liquide contenant glucides et sels minéraux (jus de fruits), sauf si elle vomit", "Ne jamais lui donner à boire"], "correct": ["L'installer en position d'attente et la réhydrater avec de l'eau ou, mieux, un liquide contenant glucides et sels minéraux (jus de fruits), sauf si elle vomit"], "remarque": "En cas de détresse vitale, on applique la conduite à tenir adaptée."}, {"type": "qcm", "question": "Quelle est la conduite devant des crampes liées à la chaleur ?", "options": ["Faire reprendre l'activité immédiatement", "Refroidir éventuellement avec de la glace", "Compléter par des étirements doux", "Compléter par des massages musculaires"], "correct": ["Refroidir éventuellement avec de la glace", "Compléter par des étirements doux", "Compléter par des massages musculaires"], "remarque": "Il faut indiquer à la victime de ne pas reprendre l'activité avant l'arrêt complet des signes."}, {"type": "qcm", "question": "Quel refroidissement réaliser devant une insolation ?", "options": ["Un refroidissement actif avancé (immersion)", "Un refroidissement actif simple, en fonction des moyens disponibles", "Aucun refroidissement : un simple repos suffit"], "correct": ["Un refroidissement actif simple, en fonction des moyens disponibles"], "remarque": "On poursuit le bilan et on surveille attentivement la victime."}, {"type": "qcm", "question": "Quel refroidissement réaliser devant un coup de chaleur ou une hyperthermie maligne d'effort ?", "options": ["Un refroidissement actif avancé", "Un refroidissement passif seul", "Un refroidissement actif simple"], "correct": ["Un refroidissement actif avancé"], "remarque": "Il faut mettre tout en œuvre pour réaliser ce refroidissement actif. On transmet le bilan pour avis sans délai et on surveille l'évolution des signes de détresse vitale et la température corporelle."}, {"type": "qcm", "question": "Jusqu'à quand poursuivre le refroidissement actif d'un coup de chaleur ?", "options": ["Jusqu'à l'apparition de frissons", "Jusqu'à la disparition des signes neurologiques et une température inférieure à 39 °C (ou pendant 15 minutes si la température ne peut être mesurée)", "Pendant 5 minutes, quelle que soit la température"], "correct": ["Jusqu'à la disparition des signes neurologiques et une température inférieure à 39 °C (ou pendant 15 minutes si la température ne peut être mesurée)"], "remarque": "Un bilan complet est nécessaire avant toute verticalisation ou mobilisation après l'immersion : ces victimes peuvent présenter une hypotension (déshydratation) aggravée à l'orthostatisme, pouvant aller jusqu'à un désamorçage cardiaque."}, {"type": "qcm", "question": "Pourquoi le refroidissement est-il un geste de premier secours essentiel ?", "options": ["Il prévient la déshydratation et les atteintes du foie, des reins, du système nerveux et cardio-vasculaire, et évite le décès ou des séquelles", "Il prévient les gelures", "Il supprime uniquement la douleur"], "correct": ["Il prévient la déshydratation et les atteintes du foie, des reins, du système nerveux et cardio-vasculaire, et évite le décès ou des séquelles"], "remarque": "Il est indiqué chez une victime qui présente une hyperthermie, par exemple lors d'affections liées à la chaleur."}, {"type": "qcm", "question": "Quels gestes constituent le refroidissement passif ?", "options": ["Soustraire la victime à la cause", "Limiter tout effort", "Lui faire boire de l'alcool", "L'installer dans un endroit frais, climatisé si possible", "Retirer les vêtements superflus en laissant au minimum les sous-vêtements"], "correct": ["Soustraire la victime à la cause", "L'installer dans un endroit frais, climatisé si possible", "Retirer les vêtements superflus en laissant au minimum les sous-vêtements", "Limiter tout effort"], "remarque": "Plusieurs moyens peuvent être utilisés, seuls ou en association, pour augmenter la déperdition de chaleur."}, {"type": "qcm", "question": "Comment réalise-t-on un refroidissement actif avancé ?", "options": ["Maintenir la tête de la victime hors de l'eau", "Remuer activement l'eau autour de la victime", "Immerger également la tête de la victime", "Immerger le corps entièrement dans un bain d'eau fraîche, froide ou glacée"], "correct": ["Immerger le corps entièrement dans un bain d'eau fraîche, froide ou glacée", "Maintenir la tête de la victime hors de l'eau", "Remuer activement l'eau autour de la victime"], "remarque": "La température de l'eau doit être la plus froide possible. Remuer favorise les échanges thermiques entre l'eau et la peau et évite une éventuelle brûlure par la glace qui resterait en contact."}, {"type": "qcm", "question": "En contexte de premiers secours, que peut-on improviser pour assurer un refroidissement actif ?", "options": ["Rien : sans baignoire, il faut renoncer", "Une petite piscine pour enfants remplie d'eau", "Une bâche contenant de l'eau et de la glace, dans laquelle on enveloppe la victime en la faisant doucement osciller"], "correct": ["Une petite piscine pour enfants remplie d'eau", "Une bâche contenant de l'eau et de la glace, dans laquelle on enveloppe la victime en la faisant doucement osciller"], "remarque": "Une improvisation doit être nécessaire pour assurer coûte que coûte un refroidissement actif : baignoire de la personne, bâche plastique, glace obtenue chez le voisin ou au bar du coin, demande de renforts."}, {"type": "qcm", "question": "Quels sont des moyens du refroidissement actif simple ?", "options": ["Immerger la victime dans un bain d'eau glacée", "Pulvériser de l'eau à température ambiante sur la victime", "Ventiler la victime (courant d'air, ventilateur)", "Appliquer des linges ou draps imbibés d'eau froide sur le corps"], "correct": ["Pulvériser de l'eau à température ambiante sur la victime", "Ventiler la victime (courant d'air, ventilateur)", "Appliquer des linges ou draps imbibés d'eau froide sur le corps"], "remarque": "Pulvériser de l'eau pour mouiller augmente la déperdition de chaleur par évaporation. La ventilation l'augmente par convection."}, {"type": "qcm", "question": "Comment placer la glace lors d'un refroidissement actif simple ?", "options": ["Directement sur la peau du thorax", "Uniquement sur les chevilles", "Sans contact direct avec la peau, au niveau des gros troncs vasculaires (plis de l'aine, aisselles), de la tête et de la nuque"], "correct": ["Sans contact direct avec la peau, au niveau des gros troncs vasculaires (plis de l'aine, aisselles), de la tête et de la nuque"], "remarque": "L'absence de contact direct avec la peau évite de la brûler."}, {"type": "qcm", "question": "Une victime a perdu connaissance mais respire normalemen const $app = document.getElementById('app');
const attr = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const esc = s => String(s); // les textes (formules comprises) sont déjà convertis en HTML au moment de la génération
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).trim();

const noteOf = x => { const r = x && x.remarque; return Array.isArray(r) ? r.join('\n') : (r ? String(r) : ''); };
const noteHtml = n => n ? `<div class="ans note"><b>Remarque</b>${esc(n)}</div>` : '';
const items = DATA.map(d => d.type === 'qcm'
  ? { kind: 'qcm', q: d.question, options: d.options, correct: d.correct.map(norm), note: noteOf(d) }

  ? { kind: 'open', q: d.question, correct: d.correct, note: noteOf(d) }
  : { kind: 'num', titre: (d['titre '] || d.titre || '').trim(), img: d.image, variants: d.variantes, note: noteOf(d) });

const cfg = { mode: 'all', mix: true, n: 0 };
const pool = () => items.filter(x => cfg.mode === 'all' || (cfg.mode === 'qcm') === (x.kind === 'qcm'));
let deck = [], i = 0, score = 0, missed = [], done = false, sel = new Set(), cur = null;

function best() { try { return JSON.parse(localStorage.getItem('quiz-chaud-froid-best')); } catch (e) { return null; } }
function saveBest(s, n) { try { const b = best(); if (!b || s / n >= b.s / b.n) localStorage.setItem('quiz-chaud-froid-best', JSON.stringify({ s, n })); } catch (e) {} }

function home() {
  const nQ = items.filter(x => x.kind === 'qcm').length, nO = items.length - nQ, b = best();
  const total = pool().length, sizes = [5, 10, 20, 30].filter(k => k < total);
  if (!sizes.includes(cfg.n)) cfg.n = 0;
  $app.innerHTML = `
  <div class="hero"><h1>Quiz Chaud / Froid</h1>

    ${[['all', `Toutes (${items.length})`], ['qcm', `QCM (${nQ})`], ['open', `Ouvertes et exercices (${nO})`]].map(([k, l]) => `<button class="chip" data-mode="${k}" aria-pressed="${cfg.mode === k}">${l}</button>`).join('')}

  ${sizes.length ? `<div class="group"><b>Nombre de questions</b><div class="chips">

  <div class="group"><b>Ordre</b><div class="chips">
    <button class="chip" data-mix="1" aria-pressed="${cfg.mix}">Mélangé</button>

  </div></div>
  <button class="btn" id="go">Commencer</button>
  ${b ? `<p class="mute" style="margin-top:16px;text-align:center">Meilleur score : ${b.s} / ${b.n}</p>` : ''}`;
  $app.querySelectorAll('[data-mode]').forEach(e => e.onclick = () => { cfg.mode = e.dataset.mode; home(); });
  $app.querySelectorAll('[data-n]').forEach(e => e.onclick = () => { cfg.n = +e.dataset.n; home(); });
  $app.querySelectorAll('[data-mix]').forEach(e => e.onclick = () => { cfg.mix = e.dataset.mix === '1'; home(); });
  document.getElementById('go').onclick = () => start(pool());

function start(list, n = cfg.n) {
  if (n && n < list.length) {
    const keep = new Set(shuffle(list.map((_, k) => k)).slice(0, n));
    list = list.filter((_, k) => keep.has(k));
  }
  deck = cfg.mix ? shuffle(list) : list.slice();
  i = 0; score = 0; missed = []; next(0);
}

function next(step) { i += step; i >= deck.length ? result() : show(); }

function head() {
  return `<div class="bar" role="progressbar" aria-valuenow="${i + 1}" aria-valuemax="${deck.length}"><i style="width:${(i / deck.length) * 100}%"></i></div>
  <div class="meta"><span>Question ${i + 1} sur ${deck.length}</span><span>Score ${score}</span></div>`;
}

function show() {
  window.scrollTo(0, 0); done = false; sel = new Set();
  const it = deck[i];
  if (it.kind === 'qcm') {
    cur = { it, opts: cfg.mix ? shuffle(it.options) : it.options.slice() };
    const multi = it.correct.length > 1;
    $app.innerHTML = head() + `<h2>${esc(it.q)}</h2>
    <p class="hint">${multi ? 'Plusieurs réponses possibles.' : 'Une seule réponse.'}</p>
    <div class="opts">${cur.opts.map((o, k) => `<button class="opt ${multi ? '' : 'single'}" data-k="${k}" aria-pressed="false"><span class="mk"></span><span>${esc(o)}</span></button>`).join('')}</div>
    <button class="btn" id="ok" disabled>Valider</button>`;
    const ok = document.getElementById('ok');
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (done) return;
      const k = +b.dataset.k;
      if (!multi) { sel.clear(); $app.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); }
      sel.has(k) ? sel.delete(k) : sel.add(k);
      b.classList.toggle('on', sel.has(k));
      $app.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', sel.has(+x.dataset.k)));
      ok.disabled = sel.size === 0;
    });
    ok.onclick = () => done ? next(1) : gradeQcm(ok);
  } else {
    const v = it.kind === 'num' ? it.variants[Math.floor(Math.random() * it.variants.length)] : it;
    cur = { it, v };
    $app.innerHTML = head() +
      (it.kind === 'num' ? `<p class="titre">${esc(it.titre)}</p>` : '') +
      `<h2>${esc(v.question || v.q)}</h2>` +
      (it.kind === 'num' && it.img ? `<figure><img src="${attr(it.img)}" alt="Schéma" onerror="this.parentNode.remove()"></figure>` : '') +
      `<p class="hint" style="margin-top:18px">${it.kind === 'num' ? 'Cherche la réponse (sur papier si besoin), puis compare.' : 'Réponds dans ta tête ou à voix haute, puis compare.'}</p>
      <div id="slot"><button class="btn" id="rev">Voir la réponse</button></div>`;
    document.getElementById('rev').onclick = () => revealOpen();
  }
}

function gradeQcm(btn) {
  done = true;
  const { it, opts } = cur;
  const picked = new Set([...sel].map(k => norm(opts[k])));
  const right = it.correct.length === picked.size && it.correct.every(c => picked.has(c));
  $app.querySelectorAll('.opt').forEach(b => {
    const o = norm(opts[+b.dataset.k]), isC = it.correct.includes(o), isP = picked.has(o);
    b.classList.remove('on');
    const mk = b.querySelector('.mk');
    if (isC && isP) { b.classList.add('ok'); mk.textContent = '✓'; }
    else if (isP) { b.classList.add('ko'); mk.textContent = '✗'; }
    else if (isC) { b.classList.add('ok', 'miss'); mk.textContent = '✓'; }
  });
  if (right) score++; else missed.push({ q: it.q, a: it.correct.join('\n'), n: it.note });
  btn.insertAdjacentHTML('beforebegin', `<p class="verdict ${right ? 'ok' : 'ko'}">${right ? 'Bonne réponse.' : 'Pas tout à fait : les bonnes réponses sont cochées en vert.'}</p>` + noteHtml(it.note));
  btn.textContent = i + 1 < deck.length ? 'Question suivante' : 'Voir le résultat';
}

function revealOpen() {
  const { it, v } = cur;
  const ans = (v.correct || []).join('\n');
  const note = noteOf(v) || it.note;
  document.getElementById('slot').innerHTML = `<div class="ans"><b>Réponse attendue</b>${esc(ans)}</div>${noteHtml(note)}
  <div class="row"><button class="btn alt" id="no">À revoir</button><button class="btn" id="yes">Je l’avais</button></div>`;
  const fin = good => { if (good) score++; else missed.push({ q: v.question || v.q, a: ans, n: note }); next(1); };
  document.getElementById('yes').onclick = () => fin(true);
  document.getElementById('no').onclick = () => fin(false);
}

function result() {
  window.scrollTo(0, 0);
  const n = deck.length; saveBest(score, n);
  const pct = Math.round(score / n * 100);
  $app.innerHTML = `<div class="hero"><h2>Terminé</h2><div class="score">${score}<span class="mute" style="font-size:2rem"> / ${n}</span></div>
  <p class="mute">${pct} % de réussite</p></div>
  ${missed.length ? `<div class="rev">${missed.map(m => `<div>${esc(m.q)}<small>${esc(m.a)}</small>${m.n ? `<small><i>Remarque : ${esc(m.n)}</i></small>` : ''}</div>`).join('')}</div>` : '<p class="verdict ok" style="margin-top:20px">Aucune erreur.</p>'}
  ${missed.length ? '<button class="btn" id="retry">Refaire mes erreurs</button>' : ''}
  <button class="btn alt" id="home">Retour à l’accueil</button>`;
  document.getElementById('home').onclick = home;
  const r = document.getElementById('retry');
  if (r) r.onclick = () => {
    const bad = new Set(missed.map(m => m.q));
    start(items.filter(x => x.kind === 'num' ? x.variants.some(v => bad.has(v.question)) : bad.has(x.q)), 0);
  };
}
home();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
